; Kulübe İklim Kontrolörü — PlatformIO yapılandırması
; F1: saf çekirdek (lib/core) + native Unity testleri. Karta yükleme yalnız açık talimatla.

[platformio]
default_envs = esp32-s3-devkitc-1

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
test_ignore = native/*

[env:native]
platform = native
test_framework = unity
test_filter = native/*
build_flags = -std=gnu++17 -Wall -Wextra -Werror -O1 -DCC_NATIVE_TEST
