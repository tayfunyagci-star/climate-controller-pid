; Kulübe İklim Kontrolörü — PlatformIO yapılandırması
; F1: saf çekirdek (lib/core) + native Unity testleri. F2: HAL + FreeRTOS görevleri + seri konsol.
; Karta yükleme yalnız açık talimatla; ilk HIL'de rezistans yerine SSR girişlerinde LED (HIL.md).

[platformio]
default_envs = esp32dev

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra

; Üretim imajı — ESP32 DevKit V1 (ESP32-WROOM-32, 4 MB flash, PSRAM yok).
; espressif32 6.13.0 = Arduino-ESP32 2.0.17 (ESP-IDF 4.4); diğer SCADA projeleriyle (Flowmeter ESP32) aynı sürüm.
[env:esp32dev]
platform = espressif32@6.13.0
board = esp32doit-devkit-v1
framework = arduino
board_build.partitions = partitions_4mb_ota.csv
board_upload.flash_size = 4MB
extra_scripts = pre:tools/prebuild.py          ; tools/ui → include/ui_generated.h
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
build_flags = ${env.build_flags} -DCORE_DEBUG_LEVEL=1
test_ignore = native/*

; --- OTA (ArduinoOTA / espota) ---------------------------------------------------------------
; OTA yalnız OTA parolası tanımlıysa açılır (D-17: parolasız OTA yok). Parola seri konsoldan:
;   otapass <8-64 karakter>      (yalnız MD5 özeti NVS'te saklanır)
; Yükleme öncesi güvenli duruş: konsolda `ota` (ısıtma durur, post-cool biter) → `status` OTA=hazir.
; Hazırlık yapılmadan başlayan yükleme cihaz tarafından iptal edilir ve hazırlık başlatılır.
; Kullanmak için aşağıdaki satırların başındaki ';' işaretini kaldırın:
upload_protocol = espota
upload_port = 192.168.68.78                   ; seri konsol `status` veya web üst bilgi şeridindeki IP
;                                              ; mDNS de olur: kulube-iklim.local (Windows'ta çözülmeyebilir)
;upload_flags =
;    --auth=OTA_PAROLASI                       ; otapass ile verilen parola (depoya işlemeyin)
;    --port=3232                               ; ArduinoOTA varsayılan portu
;    --host_port=13025                         ; Windows ayrılmış port aralıkları espota dinleyicisini engelleyebilir

; HIL imajı: + sensör benzetimi ve görev dondurma konsol komutları (sim, hang). Sahaya yüklenmez.
[env:esp32dev-hil]
extends = env:esp32dev
build_flags = ${env.build_flags} -DCORE_DEBUG_LEVEL=3 -DCC_HIL=1

[env:native]
platform = native
test_framework = unity
test_filter = native/*
build_flags = -std=gnu++17 -Wall -Wextra -Werror -O1 -DCC_NATIVE_TEST
