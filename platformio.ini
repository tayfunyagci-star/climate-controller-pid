; Kulübe İklim Kontrolörü — PlatformIO yapılandırması
; F1: saf çekirdek (lib/core) + native Unity testleri. F2: HAL + FreeRTOS görevleri + seri konsol.
; Karta yükleme yalnız açık talimatla; ilk HIL'de rezistans yerine SSR girişlerinde LED (HIL.md).

[platformio]
default_envs = esp32-s3-devkitc-1

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra

; Üretim imajı. espressif32 6.9.0 = Arduino-ESP32 2.0.17 (ESP-IDF 4.4); sürüm sabitlenir (tekrarlanabilir build).
; PSRAM etkin değil (N8R8/N8R2 varyantı doğrulanmadı; F2 PSRAM gerektirmez).
[env:esp32-s3-devkitc-1]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = partitions_8mb_ota.csv
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags = ${env.build_flags} -DCORE_DEBUG_LEVEL=1
test_ignore = native/*

; HIL imajı: + sensör benzetimi ve görev dondurma konsol komutları (sim, hang). Sahaya yüklenmez.
[env:esp32-s3-hil]
extends = env:esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DCORE_DEBUG_LEVEL=3 -DCC_HIL=1

[env:native]
platform = native
test_framework = unity
test_filter = native/*
build_flags = -std=gnu++17 -Wall -Wextra -Werror -O1 -DCC_NATIVE_TEST
